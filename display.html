<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  :root {
    --brand-primary: #4f46e5;
    --brand-secondary: #06b6d4;
    --brand-success: #22c55e;
    --brand-danger: #ef4444;
    --brand-warning: #f59e0b;
    --bg-body: #f3f4f9;
    --bg-card: #ffffff;
    --text-main: #1f2333;
    --text-muted: #6b7280;
    --border-color: #e5e7eb;
    --sidebar-bg: #1e1b3a;
    --sidebar-text: #cbd5e1;
  }

  [data-theme="dark"] {
    --bg-body: #12141c;
    --bg-card: #1b1e2b;
    --text-main: #e5e7eb;
    --text-muted: #9ca3af;
    --border-color: #2b2f3f;
    --sidebar-bg: #0d0e17;
  }

  * { font-family: 'Poppins', sans-serif; }

  body {
    background: var(--bg-body);
    color: var(--text-main);
    transition: background .25s ease, color .25s ease;
  }

  .app-sidebar {
    background: linear-gradient(180deg, var(--sidebar-bg), #2a1f5e);
    min-height: 100vh;
    color: var(--sidebar-text);
    position: fixed;
    width: 240px;
    z-index: 1030;
    transition: left .25s ease;
  }
  .app-sidebar .brand { font-weight: 700; font-size: 1.15rem; color: #fff; }
  .app-sidebar .nav-link {
    color: var(--sidebar-text);
    border-radius: 10px;
    margin: 2px 10px;
    padding: .6rem .9rem;
    font-weight: 500;
    transition: all .15s ease;
  }
  .app-sidebar .nav-link i { width: 22px; text-align: center; margin-right: 8px; }
  .app-sidebar .nav-link:hover, .app-sidebar .nav-link.active {
    background: rgba(255,255,255,0.12);
    color: #fff;
  }

  .app-main { margin-left: 240px; transition: margin-left .25s ease; }

  @media (max-width: 991px) {
    .app-sidebar { left: -240px; }
    .app-sidebar.show { left: 0; }
    .app-main { margin-left: 0; }
  }

  .app-navbar {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-color);
    position: sticky; top: 0; z-index: 1020;
  }

  .card-glass {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(20,20,50,0.05);
  }

  .stat-card {
    border-radius: 16px;
    padding: 1.1rem 1.3rem;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .stat-card i { font-size: 1.8rem; opacity: .55; }
  .stat-card.grad-1 { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
  .stat-card.grad-2 { background: linear-gradient(135deg, #06b6d4, #0ea5e9); }
  .stat-card.grad-3 { background: linear-gradient(135deg, #22c55e, #16a34a); }
  .stat-card.grad-4 { background: linear-gradient(135deg, #f59e0b, #ea580c); }

  .ps-card {
    border-radius: 16px;
    padding: 1rem;
    cursor: pointer;
    color: #fff;
    text-align: center;
    transition: transform .15s ease;
    min-height: 130px;
  }
  .ps-card:hover { transform: translateY(-4px); }
  .ps-card.kosong { background: linear-gradient(135deg, #22c55e, #16a34a); }
  .ps-card.dipakai { background: linear-gradient(135deg, #ef4444, #b91c1c); }
  .ps-card.maintenance { background: linear-gradient(135deg, #f59e0b, #d97706); }
  .ps-card.menunggu-mulai {
    background: linear-gradient(135deg, #f59e0b, #b45309) !important;
    animation: pulseWaiting 1.6s ease-in-out infinite;
  }
  @keyframes pulseWaiting { 0%,100% { box-shadow: 0 0 0 rgba(245,158,11,0); } 50% { box-shadow: 0 0 22px rgba(245,158,11,0.55); } }
  .ps-card .badge-status { background: rgba(255,255,255,.25); }
  .ps-card .timer { font-size: 1.4rem; font-weight: 600; }

  .skeleton {
    background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 37%, #e5e7eb 63%);
    background-size: 400% 100%;
    animation: skeleton-loading 1.4s ease infinite;
    border-radius: 8px;
  }
  @keyframes skeleton-loading { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  .table thead th { font-weight: 600; color: var(--text-muted); border-bottom-width: 1px; }
  .table td, .table th { vertical-align: middle; color: var(--text-main); }

  .fade-in { animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  #receiptArea { display: none; }
  @media print {
    body * { visibility: hidden; }
    #receiptArea, #receiptArea * { visibility: visible; }
    #receiptArea {
      display: block !important;
      position: absolute; left: 0; top: 0;
      width: 58mm; font-size: 11px; font-family: 'Courier New', monospace;
    }
  }
</style>

  <style>
    html, body {
      height: 100%; margin: 0; overflow: hidden;
      background: #0b0c14; color: #fff;
      font-family: 'Poppins', sans-serif;
    }
    #tvWrap {
      height: 100vh; width: 100vw;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 2rem; box-sizing: border-box;
      transition: background .4s ease;
    }
    #tvWrap.state-kosong { background: radial-gradient(circle at center, #14532d, #0b0c14 75%); }
    #tvWrap.state-dipakai { background: radial-gradient(circle at center, #1e1b3a, #0b0c14 75%); }
    #tvWrap.state-menunggu { background: radial-gradient(circle at center, #78350f, #0b0c14 75%); animation: pulseBg 1.6s ease-in-out infinite; }
    @keyframes pulseBg { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }
    #tvWrap.state-overtime { background: radial-gradient(circle at center, #7f1d1d, #0b0c14 75%); animation: flashBg 1.2s ease-in-out infinite; }
    #tvWrap.state-maintenance { background: radial-gradient(circle at center, #78350f, #0b0c14 75%); }
    @keyframes flashBg { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.35); } }

    #tvLogo { width: 64px; height: 64px; object-fit: cover; border-radius: 16px; margin-bottom: 1rem; display: none; }
    #tvRentalName { font-size: 1.4rem; opacity: .75; letter-spacing: .05em; margin-bottom: .3rem; }
    #tvUnitName { font-size: 3.2rem; font-weight: 700; margin-bottom: .3rem; }
    #tvSubInfo { font-size: 1.3rem; opacity: .85; margin-bottom: 2rem; }

    #tvStateLabel { font-size: 2rem; font-weight: 600; margin-bottom: 1rem; }
    #tvTimer {
      font-size: 8rem; font-weight: 700; letter-spacing: .04em;
      font-variant-numeric: tabular-nums; line-height: 1;
      text-shadow: 0 0 40px rgba(255,255,255,0.25);
    }
    #tvExtraInfo { font-size: 1.4rem; opacity: .8; margin-top: 1.5rem; }
    #tvOvertimeWarning {
      display: none; font-size: 2.2rem; font-weight: 700; color: #fecaca;
      margin-top: 1.5rem; animation: pulseText 1s ease-in-out infinite;
    }
    @keyframes pulseText { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

    #tvIcon { font-size: 5rem; margin-bottom: 1rem; }
    #tvClock { position: fixed; top: 24px; right: 32px; font-size: 1.4rem; opacity: .6; font-variant-numeric: tabular-nums; }
    #tvError { font-size: 1.6rem; color: #fca5a5; max-width: 600px; }

    /* ---------- Mode Grid (Semua Unit) ---------- */
    #tvGridWrap {
      display: none;
      height: 100vh; width: 100vw; box-sizing: border-box;
      padding: 2.5rem 3rem; background: radial-gradient(circle at top, #1e1b3a, #0b0c14 80%);
    }
    #tvGridHeader { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; }
    #tvGridHeader img { width: 56px; height: 56px; object-fit: cover; border-radius: 14px; display: none; }
    #tvGridHeader h1 { font-size: 2.2rem; font-weight: 700; margin: 0; }
    #tvGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }
    .tv-unit-card {
      border-radius: 20px; padding: 1.5rem; text-align: center;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      transition: background .4s ease;
    }
    .tv-unit-card.kosong { background: rgba(34,197,94,0.18); border-color: rgba(34,197,94,0.4); }
    .tv-unit-card.dipakai { background: rgba(79,70,229,0.22); border-color: rgba(129,140,248,0.4); }
    .tv-unit-card.menunggu { background: rgba(217,119,6,0.28); border-color: rgba(251,191,36,0.5); animation: pulseBg 1.6s ease-in-out infinite; }
    .tv-unit-card.overtime { background: rgba(220,38,38,0.35); border-color: rgba(252,165,165,0.6); animation: flashBg 1.2s ease-in-out infinite; }
    .tv-unit-card.maintenance { background: rgba(217,119,6,0.22); border-color: rgba(251,191,36,0.4); }
    .tv-unit-card .unit-name { font-size: 1.5rem; font-weight: 700; margin-bottom: .2rem; }
    .tv-unit-card .unit-sub { font-size: .95rem; opacity: .75; margin-bottom: .8rem; }
    .tv-unit-card .unit-status { font-size: 1rem; font-weight: 600; margin-bottom: .5rem; letter-spacing: .03em; }
    .tv-unit-card .unit-timer { font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .tv-unit-card .unit-player { font-size: .95rem; opacity: .85; margin-top: .3rem; }
  </style>
</head>
<body>
  <div id="tvClock"></div>

  <!-- Mode 1: Satu Unit (?ps=KODE_UNIT) -->
  <div id="tvWrap">
    <img id="tvLogo" src="" alt="Logo">
    <div id="tvRentalName"></div>
    <div id="tvUnitName">Memuat...</div>
    <div id="tvSubInfo"></div>

    <i class="fa-solid" id="tvIcon"></i>
    <div id="tvStateLabel"></div>
    <div id="tvTimer"></div>
    <div id="tvExtraInfo"></div>
    <div id="tvOvertimeWarning">&#9888; WAKTU HABIS &mdash; SILAKAN HUBUNGI KASIR</div>

    <div id="tvError" style="display:none;"></div>
  </div>

  <!-- Mode 2: Semua Unit (tanpa parameter ps) -->
  <div id="tvGridWrap">
    <div id="tvGridHeader">
      <img id="tvGridLogo" src="" alt="Logo">
      <h1 id="tvGridRentalName">PS Rental Pro</h1>
    </div>
    <div id="tvGrid"></div>
  </div>

  <script src="config.js"></script>
  <script>
    async function apiPublic(fnName, ...args) {
      const url = API_BASE_URL + '?action=' + encodeURIComponent(fnName) + '&args=' + encodeURIComponent(JSON.stringify(args));
      const res = await fetch(url, { method: 'GET' });
      if (!res.ok) throw new Error('HTTP ' + res.status + ' dari server.');
      return await res.json();
    }

    const params = new URLSearchParams(window.location.search);
    const psId = params.get('ps');

    let tickInterval = null;
    let pollInterval = null;
    let lastData = null;
    let overtimeTriggered = false;

    function fmtHms(ms) {
      const h = String(Math.floor(ms / 3600000)).padStart(2, '0');
      const m = String(Math.floor((ms % 3600000) / 60000)).padStart(2, '0');
      const s = String(Math.floor((ms % 60000) / 1000)).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function updateClock() {
      document.getElementById('tvClock').textContent =
        new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function render(data) {
      lastData = data;
      const wrap = document.getElementById('tvWrap');
      const icon = document.getElementById('tvIcon');
      wrap.className = '';

      document.getElementById('tvRentalName').textContent = data.namaRental || '';
      document.getElementById('tvUnitName').textContent = data.namaPS + (data.nomorRuangan ? ' \u2014 Ruang ' + data.nomorRuangan : '');
      document.getElementById('tvSubInfo').textContent = data.jenis || '';

      if (data.logo) {
        document.getElementById('tvLogo').src = data.logo;
        document.getElementById('tvLogo').style.display = 'inline-block';
      }

      document.getElementById('tvOvertimeWarning').style.display = 'none';
      overtimeTriggered = false;
      clearInterval(tickInterval);

      if (data.status === 'Kosong') {
        wrap.classList.add('state-kosong');
        icon.className = 'fa-solid fa-circle-check';
        document.getElementById('tvStateLabel').textContent = 'UNIT TERSEDIA';
        document.getElementById('tvTimer').textContent = '';
        document.getElementById('tvExtraInfo').textContent = 'Silakan hubungi kasir untuk mulai bermain';
      } else if (data.status === 'Maintenance') {
        wrap.classList.add('state-maintenance');
        icon.className = 'fa-solid fa-screwdriver-wrench';
        document.getElementById('tvStateLabel').textContent = 'SEDANG MAINTENANCE';
        document.getElementById('tvTimer').textContent = '';
        document.getElementById('tvExtraInfo').textContent = 'Unit belum bisa digunakan';
      } else if (data.status === 'Dipakai') {
        wrap.classList.add('state-dipakai');
        icon.className = 'fa-solid fa-gamepad';
        document.getElementById('tvExtraInfo').textContent = data.namaPelanggan ? 'Pemain: ' + data.namaPelanggan : '';

        if (data.belumMulai) {
          wrap.classList.remove('state-dipakai');
          wrap.classList.add('state-menunggu');
          icon.className = 'fa-solid fa-hourglass-half';
          document.getElementById('tvStateLabel').textContent = 'MENUNGGU PERSIAPAN';
          document.getElementById('tvTimer').textContent = '';
          document.getElementById('tvExtraInfo').textContent = (data.namaPelanggan ? 'Pemain: ' + data.namaPelanggan + ' \u2014 ' : '') + 'Unit sedang disiapkan petugas';
          return;
        }

        const jamMasuk = new Date(data.jamMasuk).getTime();
        const estimasiMenit = Number(data.estimasiMenit) || 0;

        if (estimasiMenit > 0) {
          const targetEnd = jamMasuk + estimasiMenit * 60000;
          document.getElementById('tvStateLabel').textContent = 'SISA WAKTU';
          tickInterval = setInterval(() => {
            const diff = targetEnd - Date.now();
            const wrapEl = document.getElementById('tvWrap');
            if (diff > 0) {
              document.getElementById('tvTimer').textContent = fmtHms(diff);
              wrapEl.classList.remove('state-overtime');
              wrapEl.classList.add('state-dipakai');
              document.getElementById('tvOvertimeWarning').style.display = 'none';
            } else {
              document.getElementById('tvTimer').textContent = '+' + fmtHms(-diff);
              wrapEl.classList.remove('state-dipakai');
              wrapEl.classList.add('state-overtime');
              document.getElementById('tvOvertimeWarning').style.display = 'block';
            }
          }, 1000);
        } else {
          document.getElementById('tvStateLabel').textContent = 'DURASI BERJALAN';
          tickInterval = setInterval(() => {
            document.getElementById('tvTimer').textContent = fmtHms(Date.now() - jamMasuk);
          }, 1000);
        }
      }
    }

    async function poll() {
      if (!psId) {
        await pollAll();
        return;
      }
      try {
        const res = await apiPublic('getPublicUnitStatus', psId);
        if (!res.success) {
          document.getElementById('tvError').style.display = 'block';
          document.getElementById('tvError').textContent = res.message;
          return;
        }
        document.getElementById('tvError').style.display = 'none';
        render(res.data);
      } catch (err) {
        document.getElementById('tvError').style.display = 'block';
        document.getElementById('tvError').textContent = 'Gagal terhubung ke server: ' + err;
      }
    }

    // ---------------- Mode Grid: Semua Unit ----------------
    let gridTimerIntervals = [];

    function fmtHmsShort(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      return h > 0
        ? `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
        : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    async function pollAll() {
      document.getElementById('tvWrap').style.display = 'none';
      document.getElementById('tvGridWrap').style.display = 'block';

      try {
        const res = await apiPublic('getAllUnitsPublicStatus');
        if (!res.success) {
          document.getElementById('tvGrid').innerHTML = `<p style="color:#fca5a5;font-size:1.3rem;">${res.message}</p>`;
          return;
        }
        renderGrid(res.data);
      } catch (err) {
        document.getElementById('tvGrid').innerHTML = `<p style="color:#fca5a5;font-size:1.3rem;">Gagal terhubung ke server: ${err}</p>`;
      }
    }

    function renderGrid(data) {
      gridTimerIntervals.forEach(clearInterval);
      gridTimerIntervals = [];

      document.getElementById('tvGridRentalName').textContent = data.namaRental || 'PS Rental Pro';
      if (data.logo) {
        document.getElementById('tvGridLogo').src = data.logo;
        document.getElementById('tvGridLogo').style.display = 'inline-block';
      }

      const grid = document.getElementById('tvGrid');
      grid.innerHTML = data.units.map(u => {
        const isWaiting = u.status === 'Dipakai' && u.belumMulai;
        const stateClass = u.status === 'Kosong' ? 'kosong' : (u.status === 'Maintenance' ? 'maintenance' : (isWaiting ? 'menunggu' : 'dipakai'));
        const statusText = u.status === 'Kosong' ? 'TERSEDIA' : (u.status === 'Maintenance' ? 'MAINTENANCE' : (isWaiting ? 'MENUNGGU PERSIAPAN' : 'BERMAIN'));
        return `
          <div class="tv-unit-card ${stateClass}" id="tvUnitCard-${u.id}">
            <div class="unit-name">${u.namaPS}</div>
            <div class="unit-sub">${u.jenis}${u.nomorRuangan ? ' &middot; Ruang ' + u.nomorRuangan : ''}</div>
            <div class="unit-status" id="tvUnitStatus-${u.id}">${statusText}</div>
            <div class="unit-timer" id="tvUnitTimer-${u.id}">${isWaiting ? '\u23F3' : ''}</div>
            <div class="unit-player" id="tvUnitPlayer-${u.id}">${u.namaPelanggan ? u.namaPelanggan : ''}</div>
          </div>`;
      }).join('');

      data.units.forEach(u => {
        if (u.status !== 'Dipakai' || u.belumMulai) return;
        const jamMasuk = new Date(u.jamMasuk).getTime();
        const estimasiMenit = Number(u.estimasiMenit) || 0;
        const targetEnd = estimasiMenit > 0 ? jamMasuk + estimasiMenit * 60000 : null;

        const tick = () => {
          const timerEl = document.getElementById('tvUnitTimer-' + u.id);
          const cardEl = document.getElementById('tvUnitCard-' + u.id);
          const statusEl = document.getElementById('tvUnitStatus-' + u.id);
          if (!timerEl) { return; }

          if (targetEnd) {
            const diff = targetEnd - Date.now();
            if (diff > 0) {
              timerEl.textContent = fmtHmsShort(diff);
              cardEl.classList.remove('overtime');
            } else {
              timerEl.textContent = '+' + fmtHmsShort(-diff);
              cardEl.classList.add('overtime');
              statusEl.textContent = 'WAKTU HABIS';
            }
          } else {
            timerEl.textContent = fmtHmsShort(Date.now() - jamMasuk);
          }
        };
        tick();
        gridTimerIntervals.push(setInterval(tick, 1000));
      });
    }

    poll();
    pollInterval = setInterval(poll, 8000); // sinkronisasi ulang tiap 8 detik
  </script>
</body>
</html>
