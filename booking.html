<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  :root {
    --brand-primary: #4f46e5;
    --brand-secondary: #06b6d4;
    --brand-success: #22c55e;
    --brand-danger: #ef4444;
    --brand-warning: #f59e0b;
    --bg-body: #f3f4f9;
    --bg-card: #ffffff;
    --text-main: #1f2333;
    --text-muted: #6b7280;
    --border-color: #e5e7eb;
    --sidebar-bg: #1e1b3a;
    --sidebar-text: #cbd5e1;
  }

  [data-theme="dark"] {
    --bg-body: #12141c;
    --bg-card: #1b1e2b;
    --text-main: #e5e7eb;
    --text-muted: #9ca3af;
    --border-color: #2b2f3f;
    --sidebar-bg: #0d0e17;
  }

  * { font-family: 'Poppins', sans-serif; }

  body {
    background: var(--bg-body);
    color: var(--text-main);
    transition: background .25s ease, color .25s ease;
  }

  .app-sidebar {
    background: linear-gradient(180deg, var(--sidebar-bg), #2a1f5e);
    min-height: 100vh;
    color: var(--sidebar-text);
    position: fixed;
    width: 240px;
    z-index: 1030;
    transition: left .25s ease;
  }
  .app-sidebar .brand { font-weight: 700; font-size: 1.15rem; color: #fff; }
  .app-sidebar .nav-link {
    color: var(--sidebar-text);
    border-radius: 10px;
    margin: 2px 10px;
    padding: .6rem .9rem;
    font-weight: 500;
    transition: all .15s ease;
  }
  .app-sidebar .nav-link i { width: 22px; text-align: center; margin-right: 8px; }
  .app-sidebar .nav-link:hover, .app-sidebar .nav-link.active {
    background: rgba(255,255,255,0.12);
    color: #fff;
  }

  .app-main { margin-left: 240px; transition: margin-left .25s ease; }

  @media (max-width: 991px) {
    .app-sidebar { left: -240px; }
    .app-sidebar.show { left: 0; }
    .app-main { margin-left: 0; }
  }

  .app-navbar {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-color);
    position: sticky; top: 0; z-index: 1020;
  }

  .card-glass {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(20,20,50,0.05);
  }

  .stat-card {
    border-radius: 16px;
    padding: 1.1rem 1.3rem;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .stat-card i { font-size: 1.8rem; opacity: .55; }
  .stat-card.grad-1 { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
  .stat-card.grad-2 { background: linear-gradient(135deg, #06b6d4, #0ea5e9); }
  .stat-card.grad-3 { background: linear-gradient(135deg, #22c55e, #16a34a); }
  .stat-card.grad-4 { background: linear-gradient(135deg, #f59e0b, #ea580c); }

  .ps-card {
    border-radius: 16px;
    padding: 1rem;
    cursor: pointer;
    color: #fff;
    text-align: center;
    transition: transform .15s ease;
    min-height: 130px;
  }
  .ps-card:hover { transform: translateY(-4px); }
  .ps-card.kosong { background: linear-gradient(135deg, #22c55e, #16a34a); }
  .ps-card.dipakai { background: linear-gradient(135deg, #ef4444, #b91c1c); }
  .ps-card.maintenance { background: linear-gradient(135deg, #f59e0b, #d97706); }
  .ps-card.menunggu-mulai {
    background: linear-gradient(135deg, #f59e0b, #b45309) !important;
    animation: pulseWaiting 1.6s ease-in-out infinite;
  }
  @keyframes pulseWaiting { 0%,100% { box-shadow: 0 0 0 rgba(245,158,11,0); } 50% { box-shadow: 0 0 22px rgba(245,158,11,0.55); } }
  .ps-card .badge-status { background: rgba(255,255,255,.25); }
  .ps-card .timer { font-size: 1.4rem; font-weight: 600; }

  .skeleton {
    background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 37%, #e5e7eb 63%);
    background-size: 400% 100%;
    animation: skeleton-loading 1.4s ease infinite;
    border-radius: 8px;
  }
  @keyframes skeleton-loading { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  .table thead th { font-weight: 600; color: var(--text-muted); border-bottom-width: 1px; }
  .table td, .table th { vertical-align: middle; color: var(--text-main); }

  .fade-in { animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  #receiptArea { display: none; }
  @media print {
    body * { visibility: hidden; }
    #receiptArea, #receiptArea * { visibility: visible; }
    #receiptArea {
      display: block !important;
      position: absolute; left: 0; top: 0;
      width: 58mm; font-size: 11px; font-family: 'Courier New', monospace;
    }
  }
</style>

  <style>
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top left, #4f46e5, #1e1b3a 60%);
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem 0;
    }
    .booking-card {
      width: 100%; max-width: 460px;
      background: rgba(255,255,255,0.97);
      border-radius: 20px;
      padding: 2rem 1.8rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    .booking-logo {
      width: 60px; height: 60px; border-radius: 14px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1.6rem; margin: 0 auto .8rem;
    }
    .btn-brand {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff; border: none; border-radius: 10px; padding: .7rem;
      font-weight: 600;
    }
    .btn-brand:hover { color: #fff; opacity: .92; }
    .duration-option {
      cursor: pointer; border: 1px solid #e5e7eb; border-radius: 10px;
      padding: .5rem; text-align: center; font-size: .85rem; font-weight: 600;
      transition: all .15s ease;
    }
    .duration-option.active { background: #4f46e5; color: #fff; border-color: #4f46e5; }
    #successView { display: none; text-align: center; }
    #successView i { font-size: 3rem; color: #22c55e; }
  </style>
</head>
<body>
  <div class="booking-card fade-in">

    <div id="formView">
      <div class="booking-logo" id="bookLogoIcon"><i class="fa-solid fa-gamepad"></i></div>
      <img id="bookLogoImg" src="" alt="Logo" style="width:60px;height:60px;object-fit:cover;border-radius:14px;display:none;margin:0 auto .8rem;">
      <h5 class="text-center fw-bold mb-1" id="bookRentalName">PS Rental Pro</h5>
      <p class="text-center text-muted mb-4" style="font-size:.85rem;">Reservasi jadwal main dari mana saja</p>

      <form id="bookingForm">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Nama Lengkap</label>
          <input type="text" class="form-control" id="bkNama" required>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">No. WhatsApp / HP</label>
          <input type="tel" class="form-control" id="bkNoHP" placeholder="08xxxxxxxxxx" required>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Pilih Unit PlayStation</label>
          <select class="form-select" id="bkUnit" required>
            <option value="">Memuat unit...</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Tanggal &amp; Jam Main</label>
          <input type="datetime-local" class="form-control" id="bkWaktu" required>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Lama Bermain</label>
          <div class="row g-2" id="durationOptions">
            <div class="col-3"><div class="duration-option" data-menit="60">1 Jam</div></div>
            <div class="col-3"><div class="duration-option" data-menit="120">2 Jam</div></div>
            <div class="col-3"><div class="duration-option" data-menit="180">3 Jam</div></div>
            <div class="col-3"><div class="duration-option" data-menit="240">4 Jam</div></div>
          </div>
          <input type="hidden" id="bkEstimasiMenit" value="60">
        </div>
        <div class="mb-4">
          <label class="form-label small fw-semibold">Tarif</label>
          <select class="form-select" id="bkTarifType">
            <option value="Reguler">Reguler</option>
            <option value="Member">Member</option>
          </select>
        </div>
        <button type="submit" class="btn btn-brand w-100">
          <i class="fa-solid fa-calendar-check me-2"></i>Kirim Reservasi
        </button>
      </form>
    </div>

    <div id="successView">
      <i class="fa-solid fa-circle-check mb-3"></i>
      <h5 class="fw-bold mb-2">Reservasi Terkirim!</h5>
      <p class="text-muted mb-1">Kode reservasi Anda:</p>
      <p class="fw-bold fs-4 mb-3" id="successCode">-</p>
      <p class="text-muted small mb-4">
        Reservasi Anda akan segera dikonfirmasi oleh pihak rental.
        Simpan kode di atas untuk referensi.
      </p>
      <button class="btn btn-outline-secondary w-100" onclick="resetForm_()">Buat Reservasi Lain</button>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.6/dist/sweetalert2.all.min.js"></script>
  <script src="config.js"></script>
  <script>
    async function apiPublic(fnName, ...args) {
      const url = API_BASE_URL + '?action=' + encodeURIComponent(fnName) + '&args=' + encodeURIComponent(JSON.stringify(args));
      const res = await fetch(url, { method: 'GET' });
      if (!res.ok) throw new Error('HTTP ' + res.status + ' dari server.');
      return await res.json();
    }

    function toastError(msg) {
      Swal.fire({ toast: true, position: 'top-end', icon: 'error', title: msg, showConfirmButton: false, timer: 3200 });
    }
    function showLoading(text) {
      Swal.fire({ title: text || 'Memproses...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    }
    function hideLoading() { Swal.close(); }

    // Set batas minimal datetime-local ke waktu sekarang (+15 menit) supaya tidak booking waktu lampau.
    (function setMinDateTime() {
      const now = new Date(Date.now() + 15 * 60000);
      const pad = n => String(n).padStart(2, '0');
      const minVal = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
      document.getElementById('bkWaktu').min = minVal;
      document.getElementById('bkWaktu').value = minVal;
    })();

    // Muat branding (logo & nama rental) untuk tampilan.
    (async function loadBranding() {
      try {
        const res = await apiPublic('getPublicBranding');
        if (res.success) {
          document.getElementById('bookRentalName').textContent = res.data.nama;
          document.title = res.data.nama + ' - Reservasi Online';
          if (res.data.logo) {
            document.getElementById('bookLogoImg').src = res.data.logo;
            document.getElementById('bookLogoImg').style.display = 'inline-block';
            document.getElementById('bookLogoIcon').style.display = 'none';
          }
        }
      } catch (e) { /* biarkan tampilan default */ }
    })();

    // Muat daftar unit PS.
    (async function loadUnits() {
      const select = document.getElementById('bkUnit');
      try {
        const res = await apiPublic('getPlaystationListPublic');
        if (!res.success || !res.data.length) {
          select.innerHTML = '<option value="">Tidak ada unit tersedia</option>';
          return;
        }
        select.innerHTML = '<option value="">-- Pilih unit --</option>' +
          res.data.map(u => `<option value="${u.id}">${u.namaPS} (${u.jenis})</option>`).join('');
      } catch (e) {
        select.innerHTML = '<option value="">Gagal memuat unit</option>';
      }
    })();

    // Pilihan durasi cepat.
    document.querySelectorAll('.duration-option').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('.duration-option').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('bkEstimasiMenit').value = el.dataset.menit;
      });
    });
    document.querySelector('.duration-option[data-menit="60"]').classList.add('active');

    document.getElementById('bookingForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const payload = {
        namaPelanggan: document.getElementById('bkNama').value.trim(),
        noHP: document.getElementById('bkNoHP').value.trim(),
        nomorPS: document.getElementById('bkUnit').value,
        waktuMulai: document.getElementById('bkWaktu').value,
        estimasiMenit: Number(document.getElementById('bkEstimasiMenit').value),
        tarifType: document.getElementById('bkTarifType').value
      };
      if (!payload.nomorPS) { toastError('Pilih unit PlayStation dulu.'); return; }

      showLoading('Mengirim reservasi...');
      try {
        const res = await apiPublic('createPublicReservation', payload);
        hideLoading();
        if (!res.success) { toastError(res.message); return; }

        document.getElementById('formView').style.display = 'none';
        document.getElementById('successView').style.display = 'block';
        document.getElementById('successCode').textContent = res.data.id;
      } catch (err) {
        hideLoading();
        toastError('Gagal terhubung ke server: ' + err);
      }
    });

    function resetForm_() {
      document.getElementById('bookingForm').reset();
      document.getElementById('successView').style.display = 'none';
      document.getElementById('formView').style.display = 'block';
    }
  </script>
</body>
</html>
